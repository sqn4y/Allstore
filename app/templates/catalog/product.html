{% extends "base.html" %}{% block content %}
<a href="{{ url_for('catalog.store', slug=store.slug) }}">← Каталог</a>
<article class="single-product">
{% if product.image_filename %}<img src="{{ product_image_url(product.image_filename) }}">{% endif %}
<h1>{{ product.name }}</h1><strong class="price">{{ "%.2f"|format(product.price|float) }}</strong>
<p>{{ product.description or product.short_description }}</p>
<form method="post" action="{{ url_for('cart.add', slug=store.slug, product_id=product.id) }}"><button class="primary">Добавить в корзину</button></form>
</article>
{% endblock %}
