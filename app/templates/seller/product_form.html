{% extends "base.html" %}{% block content %}
<h1>Новый товар</h1>
<form class="panel form" method="post" enctype="multipart/form-data">
<label>Название<input name="name" required></label>
<label>Цена<input name="price" type="number" step="0.01" min="0" required></label>
<label>Категория<select name="category_id" required>{% for c in categories %}<option value="{{ c.id }}">{{ c.name }}</option>{% endfor %}</select></label>
<label>Короткое описание<textarea name="short_description" maxlength="500"></textarea></label>
<label>Полное описание<textarea name="description"></textarea></label>
<label>Изображение<input type="file" name="image" accept="image/*"></label>
<button class="primary">Сохранить</button>
</form>
{% endblock %}
